services:
  db:
    image: postgres:16-alpine
    container_name: devnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devnest_db}
      POSTGRES_USER: ${DB_USER:-devnest_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devnest_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devnest_app} -d ${DB_NAME:-devnest_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devnest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    image: node:22-alpine
    container_name: devnest-api
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-devnest_app}:${DB_PASSWORD:-devnest_dev_password}@db:5432/${DB_NAME:-devnest_db}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
    command: >
      sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  postgres_data:
