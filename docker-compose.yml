services:
  db:
    image: postgres:16-alpine
    container_name: devnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devnest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devnest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: devnest-api
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/devnest?schema=public
      PORT: 3000
    command: >
      sh -c "npm ci && npx prisma migrate deploy && npx prisma generate && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  postgres_data:
