services:
  db:
    image: postgres:16-alpine
    container_name: devnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devnest_db}
      POSTGRES_USER: ${DB_USER:-devnest_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devnest_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devnest_app} -d ${DB_NAME:-devnest_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devnest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devnest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-devnest_app}:${DB_PASSWORD:-devnest_dev_password}@db:5432/${DB_NAME:-devnest_db}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
