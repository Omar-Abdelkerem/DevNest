services:
  - type: web
    name: devnest-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_LIFETIME
        value: 86400
      - key: CORS_ORIGINS
        value: https://devnest-web-xi.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: devnest-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: devnest-postgres
    plan: free
    databaseName: devnest_db
    user: devnest_app
